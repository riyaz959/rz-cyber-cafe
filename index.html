<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RZ Cyber Cafe</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#5b3df5"><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--bg:#eef0ff;--c:#fff;--t:#1d2140;--m:#6b7193;--b:#dfe3f7;--p:#5b3df5;--r:#ef4444;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1226;--c:#1a1e3a;--t:#eceeff;--m:#9aa0cc;--b:#2b305a;--p:#8b7bff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,"Noto Sans Bengali",sans-serif}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#5b3df5,#d946ef);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px}.hd b{flex:1;font-size:17px}.hd button{background:#ffffff33;color:#fff;border:0;padding:6px 10px}
#main{max-width:900px;margin:0 auto;padding:14px 12px calc(86px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}nav a{flex:1;text-align:center;padding:6px 2px;border-radius:10px;font-size:12px;cursor:pointer;color:var(--m)}nav a span{display:block;font-size:20px}nav a.on{color:var(--p);background:var(--bg);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.sc{border-radius:16px;padding:14px;color:#fff}.sc h3{margin:0 0 4px;font-size:15px}.sc b{font-size:30px}.sc button{margin-top:8px;background:#ffffff2e;color:#fff;border:1px solid #ffffff66;width:100%}
.k{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;color:var(--m);font-size:13px}.k b{display:block;font-size:20px;color:var(--t)}
.wc{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin:8px 0}.r1{display:flex;justify-content:space-between;gap:8px}.m{color:var(--m);font-size:13px}.m a{color:var(--p)}
.bd{color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap;align-self:flex-start}.new{background:#6366f1}.agent{background:#f59e0b}.done{background:#10b981}.deliv{background:#0ea5e9}.cancel{background:#94a3b8}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px}button{cursor:pointer}.pr{background:var(--p);color:#fff;border-color:var(--p)}.dg{color:var(--r)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}h2{margin:6px 0}.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}.err{color:var(--r)}
dialog{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;width:min(520px,94vw);max-height:90vh}label{display:block;margin:8px 0 2px;color:var(--m);font-size:13px}dialog input,dialog select,dialog textarea{width:100%;display:block}
.lg{width:38px;height:38px;border-radius:50%;background:#000}.hero{text-align:center;padding:6px 0}.hero img{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 34px #d946ef66}.hero h1{margin:10px 0 2px;background:linear-gradient(90deg,#f97316,#d946ef,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}.sc{cursor:pointer}
</style></head><body>
<div class="hd"><img class="lg" id="lg" alt="RZ"><b>RZ Cyber Cafe</b><button onclick="lang=lang=='bn'?'en':'bn';ls('lang',lang);render()">বাং/EN</button><button onclick="th()">◐</button><button id="sy" onclick="sync(1)">☁️</button></div>
<div id="main"></div><nav></nav><dialog id="dlg"></dialog><dialog id="cf"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let lang=ls('lang')||'bn',D={works:[],agents:[],tomb:[]},view='home',F='',S='',Q='',db,DL;
const T=s=>{const a=String(s).split('|');return lang==='bn'?a[0]:(a[1]||a[0])};
const tod=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),N=v=>+v||0,inr=v=>'₹'+N(v).toLocaleString('en-IN');
const SV={bio:{n:'বায়োমেট্রিক আপডেট|Biometric Update',i:'🖐️',c:'#0ea5e9',g:'linear-gradient(135deg,#0ea5e9,#2563eb)'},mob:{n:'মোবাইল নম্বর আপডেট|Mobile Number Update',i:'📱',c:'#10b981',g:'linear-gradient(135deg,#10b981,#047857)'},kid:{n:'০-৫ বছর শিশুর আধার|Child (0-5 yrs) Aadhaar',i:'👶',c:'#f59e0b',g:'linear-gradient(135deg,#f59e0b,#ef4444)'}};
const SS={new:'নতুন|New',agent:'এজেন্টের কাছে|With Agent',done:'এজেন্ট শেষ করেছে|Agent Done',deliv:'ডেলিভারি হয়েছে|Delivered',cancel:'বাতিল|Cancelled'},NEXT={new:'agent',agent:'done',done:'deliv'};
const pend=w=>w.status==='new'||w.status==='agent'||w.status==='done',live=w=>w.status!=='cancel';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('aadhaar-manager',2);r.onupgradeneeded=()=>['works','agents','tomb'].forEach(s=>r.result.objectStoreNames.contains(s)||r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const ld=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>{D[s]=q.result.sort((a,b)=>a.id<b.id?-1:1);r()};q.onerror=()=>r()});
const wr=(s,fn)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=res;t.onerror=()=>rej(t.error)});
const put=(s,o)=>wr(s,x=>x.put(o)).then(()=>sch()),del=(s,id)=>wr(s,x=>x.delete(id));
const nid=(s,p)=>p+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase();
const ask=(msg,info)=>new Promise(res=>{const d=$('#cf');d.innerHTML=`<p style="white-space:pre-line">${esc(msg)}</p><div class=bar><button class=pr>OK</button>${info?'':`<button>${T('বাতিল|Cancel')}</button>`}</div>`;const[a,b]=d.querySelectorAll('button');a.onclick=()=>{d.close();res(true)};if(b)b.onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()});
const dlg=h=>{const d=$('#dlg');if(!h)return d.close();d.innerHTML=h;if(!d.open)d.showModal()};
const csv=(h,r)=>'\ufeff'+[h,...r].map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
async function dl(name,data){try{if(DL)await DL.save({filename:name,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove()}return 1}catch(e){if(e.code!=='declined')ask(T('ফাইল সেভ হয়নি|Could not save file'),1)}}
const th=()=>{const r=document.documentElement,d=r.dataset.theme!=='dark';r.dataset.theme=d?'dark':'light';ls('theme',r.dataset.theme)};
const go=k=>{view=k;F='';S='';Q='';scrollTo(0,0);render()};
const agentOf=s=>D.agents.find(a=>a.svc.includes(s))||{};
// ---- works ----
const WF=[['service','সেবা|Service','s',1],['name','গ্রাহকের নাম|Customer name','t',1],['phone','মোবাইল|Mobile','tel',1],['ref','রসিদ/URN নম্বর (ঐচ্ছিক)|Receipt/URN no. (optional)','t'],['date','তারিখ|Date','d'],['status','অবস্থা|Status','s'],['charge','গ্রাহকের চার্জ ₹|Customer charge ₹','n'],['paid','গ্রাহক দিয়েছে ₹|Customer paid ₹','n'],['agentCharge','এজেন্টের খরচ ₹|Agent charge ₹','n'],['agentPaid','এজেন্টকে দেওয়া ₹|Paid to agent ₹','n'],['notes','নোট|Notes','a']];
const inp=([k,l,t,r],v,o)=>{const n=`name=${k}`;let h;
if(t==='a')h=`<textarea ${n} rows=2>${esc(v)}</textarea>`;
else if(t==='s'){const O=k==='service'?SV:SS,d=v||Object.keys(O)[0];h=`<select ${n}>${Object.keys(O).map(x=>`<option value="${x}" ${x==d?'selected':''}>${esc(T(k==='service'?O[x].n:O[x]))}</option>`).join('')}</select>`}
else h=`<input ${n} type="${{t:'text',tel:'tel',d:'date',n:'number'}[t]}" ${t==='n'?'min=0 step=any':''} value="${esc(v)}">`;
return`<label>${esc(T(l))}${r?' *':''}${h}</label>`};
function frm(id,svc){const r=id?D.works.find(x=>x.id===id):{service:svc,date:tod()};
dlg(`<form onsubmit="sub(event,'${id||''}')"><h3>${T('কাজ|Work')} ${id||''}</h3>${WF.map(f=>inp(f,r[f[0]]??'')).join('')}<p class=m style="color:var(--m)">⚠ ${T('আধার নম্বর বা OTP লিখবেন না।|Never enter Aadhaar number or OTP.')}</p><p id=er class=err></p><div class=bar><button class=pr>${T('সেভ|Save')}</button><button type=button onclick="dlg()">${T('বাতিল|Cancel')}</button></div></form>`)}
async function sub(e,id){e.preventDefault();const o={...(id?D.works.find(x=>x.id===id):{})},fd=new FormData(e.target),er=[];
for(const[k,l,t,r]of WF){const v=(fd.get(k)||'').trim();if(r&&!v)er.push(T(l));else if(t==='tel'&&v&&!/^[0-9+\- ]{7,15}$/.test(v))er.push(T(l)+' (7-15)');else if(t==='n'&&v&&(isNaN(v)||+v<0))er.push(T(l)+' (≥0)');o[k]=t==='n'&&v?+v:v}
if(er.length)return $('#er').textContent=T('ঠিক করুন: |Fix: ')+er.join(', ');
if(!db)return ask(T('স্টোরেজ নেই, সেভ হবে না।|Storage unavailable.'),1);
if(!id){const d=D.works.find(w=>w.phone===o.phone&&w.service===o.service&&pend(w));if(d&&!await ask(T('একই নম্বরে একই সেবার কাজ চলছে: |Same number & service already open: ')+d.id+' '+d.name+'\n'+T('তবুও সেভ করবেন?|Save anyway?')))return;o.id=nid('works','W');o.created=new Date().toISOString()}
o.agent=agentOf(o.service).id||'';o.shopId='main';o.updated=new Date().toISOString();
try{await put('works',o);await ld('works')}catch(x){return ask(T('সেভ ব্যর্থ।|Save failed.'),1)}dlg();render()}
async function adv(id){const w=D.works.find(x=>x.id===id);w.status=NEXT[w.status];w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
async function rm(id){if(!await ask(T('এই কাজ স্থায়ীভাবে মুছবেন?|Delete this work permanently?')))return;await del('works',id);await put('tomb',{id,t:new Date().toISOString()});await ld('tomb');await ld('works');render()}
function afrm(id){const a=D.agents.find(x=>x.id===id);dlg(`<form onsubmit="asub(event,'${id}')"><h3>${T('এজেন্ট|Agent')}</h3><label>${T('নাম|Name')} *<input name=name value="${esc(a.name)}"></label><label>${T('ফোন|Phone')}<input name=phone type=tel value="${esc(a.phone||'')}"></label><p id=er class=err></p><div class=bar><button class=pr>${T('সেভ|Save')}</button><button type=button onclick="dlg()">${T('বাতিল|Cancel')}</button></div></form>`)}
async function asub(e,id){e.preventDefault();const a={...D.agents.find(x=>x.id===id)},f=new FormData(e.target);a.name=(f.get('name')||'').trim();a.updated=new Date().toISOString();a.phone=(f.get('phone')||'').trim();
if(!a.name||(a.phone&&!/^[0-9+\- ]{7,15}$/.test(a.phone)))return $('#er').textContent=T('নাম/ফোন ঠিক করুন|Check name/phone');await put('agents',a);await ld('agents');dlg();render()}
// ---- views ----
const due=w=>N(w.charge)-N(w.paid),adue=w=>N(w.agentCharge)-N(w.agentPaid);
const wc=w=>{const s=SV[w.service],a=D.agents.find(x=>x.id===w.agent)||{};return`<div class=wc style="border-left:6px solid ${s.c}"><div class=r1><b>${s.i} ${esc(w.name)}</b><span class="bd ${w.status}">${T(SS[w.status])}</span></div><div class=m>${T(s.n)} · <a href="tel:${esc(w.phone)}">${esc(w.phone)}</a> · ${esc(w.date||'')} ${w.ref?'· '+esc(w.ref):''}</div><div class=m>${T('এজেন্ট|Agent')}: ${esc(a.name||'—')} · ${T('গ্রাহকের বাকি|Customer due')} <b>${inr(due(w))}</b> · ${T('এজেন্টকে বাকি|Agent due')} <b>${inr(adue(w))}</b></div><div class=bar>${NEXT[w.status]?`<button class=pr onclick="adv('${w.id}')">→ ${T(SS[NEXT[w.status]])}</button>`:''}<button onclick="frm('${w.id}')">✎</button><button class=dg onclick="rm('${w.id}')">🗑</button></div></div>`};
function adh(){const t=tod(),mo=t.slice(0,7),L=D.works.filter(live),P=D.works.filter(pend),sm=a=>a.reduce((s,w)=>s+N(w.paid),0);
const K=[['আজকের কাজ|Today’s work',L.filter(w=>w.date===t).length],['চলমান কাজ|Pending',P.length],['আজকের আদায়|Collected today',inr(sm(L.filter(w=>w.date===t)))],['মাসের আদায়|Collected this month',inr(sm(L.filter(w=>(w.date||'').startsWith(mo))))],['গ্রাহকের বাকি|Customer dues',inr(L.reduce((s,w)=>s+Math.max(0,due(w)),0))],['এজেন্টকে বাকি|Agent dues',inr(L.reduce((s,w)=>s+Math.max(0,adue(w)),0))]];
return`<h2>${T('আজকের হিসাব|Overview')}</h2><div class=g>${Object.entries(SV).map(([k,s])=>`<div class=sc style="background:${s.g}"><h3>${s.i} ${T(s.n)}</h3><b>${P.filter(w=>w.service===k).length}</b> ${T('চলমান|pending')}<button onclick="frm('','${k}')">+ ${T('নতুন কাজ|New work')}</button></div>`).join('')}</div><div class=g>${K.map(([l,v])=>`<div class=k>${T(l)}<b>${v}</b></div>`).join('')}</div><h2>${T('চলমান কাজ|Pending work')}</h2>${P.slice().reverse().map(wc).join('')||`<p class=m>${T('কোনো চলমান কাজ নেই।|No pending work.')}</p>`}`}
function works(){let r=D.works.slice().reverse();if(F)r=r.filter(w=>w.service===F);if(S)r=r.filter(w=>w.status===S);if(Q)r=r.filter(w=>[w.id,w.name,w.phone,w.ref].join(' ').toLowerCase().includes(Q));
return`<div class=bar><h2 style="flex:1;margin:0">${T('সব কাজ|All work')} (${r.length})</h2><button class=pr onclick="frm('','${F||'bio'}')">+ ${T('নতুন|New')}</button><button onclick="expC()">CSV</button></div><div class=bar>${[['','সব|All'],...Object.entries(SV).map(([k,s])=>[k,s.i+' '+s.n])].map(([k,l])=>`<button class="chip ${F===k?'on':''}" onclick="F='${k}';render()">${T(l)}</button>`).join('')}</div><div class=bar><input id=q placeholder="${T('নাম / মোবাইল / ID খুঁজুন|Search name / phone / ID')}" value="${esc(Q)}" oninput="Q=this.value.toLowerCase();render(1)"><select onchange="S=this.value;render()"><option value="">${T('সব অবস্থা|All status')}</option>${Object.entries(SS).map(([k,v])=>`<option value=${k} ${S===k?'selected':''}>${T(v)}</option>`).join('')}</select></div>${r.map(wc).join('')||`<p class=m>${T('কোনো রেকর্ড নেই।|No records yet.')}</p>`}`}
function agents(){return`<h2>${T('এজেন্ট|Agents')}</h2>`+D.agents.map(a=>{const w=D.works.filter(x=>x.agent===a.id&&live(x)),p=w.filter(pend);return`<div class=box><div class=r1><b>🧑‍💼 ${esc(a.name)}</b><button onclick="afrm('${a.id}')">✎</button></div><div class=m>${esc(a.phone||T('ফোন নেই|No phone'))}</div><div class=bar>${a.svc.map(s=>`<span class=bd style="background:${SV[s].c}">${SV[s].i} ${T(SV[s].n)}</span>`).join('')}</div><div class=g><div class=k>${T('চলমান কাজ|Pending')}<b>${p.length}</b></div><div class=k>${T('মোট কাজ|Total')}<b>${w.length}</b></div><div class=k>${T('এজেন্টকে বাকি|Agent due')}<b>${inr(w.reduce((s,x)=>s+Math.max(0,adue(x)),0))}</b></div></div>${p.map(wc).join('')}</div>`}).join('')}
function expC(){dl('aadhaar-works-'+tod()+'.csv',csv(['ID','Service','Name','Phone','Ref','Date','Status','Charge','Paid','Agent','AgentCharge','AgentPaid','Notes'],D.works.map(w=>[w.id,SV[w.service].n.split('|')[1],w.name,w.phone,w.ref,w.date,SS[w.status].split('|')[1],w.charge,w.paid,(D.agents.find(a=>a.id===w.agent)||{}).name,w.agentCharge,w.agentPaid,w.notes])))}
const bk=()=>`<h2>${T('ব্যাকআপ ও গোপনীয়তা|Backup & Privacy')}</h2>${syBox()}<div class=box><div class=bar><button class=pr onclick="expJ()">${T('সম্পূর্ণ JSON ব্যাকআপ|Full JSON backup')}</button><button onclick="expC()">${T('কাজের CSV|Work CSV')}</button></div><p>${T('শেষ ব্যাকআপ: |Last backup: ')}${esc(ls('lastBackup')||T('কখনো না|never'))}</p></div><div class=box><b>${T('JSON থেকে রিস্টোর|Restore from JSON')}</b><p class=m>${T('শুধু মার্জ: নতুন রেকর্ড যোগ হবে, পুরনো কিছু মুছবে না বা বদলাবে না।|Merge only: new records are added; nothing is deleted or overwritten.')}</p><input type=file accept=".json,application/json" onchange="imp(this.files[0]);this.value=''"></div><div class=box><b>${T('গোপনীয়তা নোটিশ|Privacy notice')}</b><p class=m>${T('ডাটা শুধু এই ডিভাইসের ব্রাউজারে (IndexedDB) থাকে। এটি ক্লাউড নয়, এনক্রিপ্টেডও নয়। ব্রাউজার ডাটা মুছলে হারাতে পারে, তাই নিয়মিত ব্যাকআপ নিন। আধার নম্বর, OTP, পাসওয়ার্ড রাখবেন না।|Data stays only in this browser (IndexedDB) on this device. It is not cloud storage and not encrypted. Clearing browser data can erase it, so back up regularly. Never store Aadhaar numbers, OTPs or passwords.')}</p></div>`;
async function expJ(){if(await dl('aadhaar-backup-'+tod()+'.json',JSON.stringify({app:'aadhaar-service-manager',version:1,shopId:'main',exported:new Date().toISOString(),data:{works:D.works,agents:D.agents}},null,1))){ls('lastBackup',new Date().toLocaleString());render()}}
async function imp(file){if(!file)return;let j;try{j=JSON.parse(await file.text());if(j.app!=='aadhaar-service-manager'||!j.data)throw 0}catch(e){return ask(T('ব্যাকআপ ফাইল সঠিক নয়।|Invalid backup file.'),1)}
