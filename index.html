<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RZ Cyber Cafe</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#5b3df5"><script src="config.js"></script><style>
:root{--bg:#eef0ff;--c:#fff;--t:#1d2140;--m:#6b7193;--b:#dfe3f7;--p:#5b3df5;--r:#ef4444;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1226;--c:#1a1e3a;--t:#eceeff;--m:#9aa0cc;--b:#2b305a;--p:#8b7bff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,"Noto Sans Bengali",sans-serif}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#5b3df5,#d946ef);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px}.hd b{flex:1;font-size:17px}.hd button{background:#ffffff33;color:#fff;border:0;padding:6px 10px}
#main{max-width:900px;margin:0 auto;padding:14px 12px calc(86px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}nav a{flex:1;text-align:center;padding:6px 2px;border-radius:10px;font-size:12px;cursor:pointer;color:var(--m)}nav a span{display:block;font-size:20px}nav a.on{color:var(--p);background:var(--bg);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.sc{border-radius:16px;padding:14px;color:#fff}.sc h3{margin:0 0 4px;font-size:15px}.sc b{font-size:30px}.sc button{margin-top:8px;background:#ffffff2e;color:#fff;border:1px solid #ffffff66;width:100%}
.k{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;color:var(--m);font-size:13px}.k b{display:block;font-size:20px;color:var(--t)}
.wc{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin:8px 0}.r1{display:flex;justify-content:space-between;gap:8px}.m{color:var(--m);font-size:13px}.m a{color:var(--p)}
.bd{color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap;align-self:flex-start}.new{background:#6366f1}.agent{background:#f59e0b}.done{background:#10b981}.deliv{background:#0ea5e9}.cancel{background:#94a3b8}.fail{background:#f97316}.void{background:#ef4444}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px}button{cursor:pointer}.pr{background:var(--p);color:#fff;border-color:var(--p)}.dg{color:var(--r)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}h2{margin:6px 0}.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}.err{color:var(--r)}
dialog{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;width:min(520px,94vw);max-height:90vh}label{display:block;margin:8px 0 2px;color:var(--m);font-size:13px}dialog input,dialog select,dialog textarea{width:100%;display:block}
.lg{width:38px;height:38px;border-radius:50%;background:#000}.hero{text-align:center;padding:6px 0}.hero img{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 34px #d946ef66}.hero h1{margin:10px 0 2px;background:linear-gradient(90deg,#f97316,#d946ef,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}.sc{cursor:pointer}
</style></head><body>
<div class="hd"><img class="lg" id="lg" alt="RZ"><b>RZ Cyber Cafe</b><button onclick="lang=lang=='bn'?'en':'bn';ls('lang',lang);render()">বাং/EN</button><button onclick="th()">◐</button><button id="sy" onclick="gs()">☁️</button></div>
<div id="main"></div><nav></nav><dialog id="dlg"></dialog><dialog id="cf"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let lang=ls('lang')||'bn',D={works:[],agents:[],tomb:[],settings:[],trash:[]},view='home',F='',S='',Q='',db,DL;
const T=s=>{const a=String(s).split('|');return lang==='bn'?a[0]:(a[1]||a[0])};
const tod=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),N=v=>+v||0,inr=v=>'₹'+N(v).toLocaleString('en-IN');
const SV={bio:{n:'বায়োমেট্রিক আপডেট|Biometric Update',i:'🖐️',c:'#0ea5e9',g:'linear-gradient(135deg,#0ea5e9,#2563eb)'},mob:{n:'মোবাইল নম্বর আপডেট|Mobile Number Update',i:'📱',c:'#10b981',g:'linear-gradient(135deg,#10b981,#047857)'},kid:{n:'০-৫ বছর শিশুর আধার|Child (0-5 yrs) Aadhaar',i:'👶',c:'#f59e0b',g:'linear-gradient(135deg,#f59e0b,#ef4444)'}};
const SS={new:'নতুন|New',agent:'নতুন|New',done:'সম্পন্ন|Done',deliv:'ডেলিভারি হয়েছে|Delivered',fail:'আবার করতে হবে|Redo',void:'ব্যর্থ (চূড়ান্ত)|Failed',cancel:'বাতিল|Cancelled'},NEXT={new:'done',agent:'done',done:'deliv',fail:'done'};
const pend=w=>['new','agent','done','fail'].includes(w.status),live=w=>w.status!=='cancel'&&w.status!=='void';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('aadhaar-manager',3);r.onupgradeneeded=()=>['works','agents','tomb','settings'].forEach(s=>r.result.objectStoreNames.contains(s)||r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const ld=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>{const a=q.result.sort((x,y)=>x.id<y.id?-1:1);if(s==='works'){D.trash=a.filter(x=>x.trashed);D.works=a.filter(x=>!x.trashed)}else D[s]=a;r()};q.onerror=()=>r()});
const wr=(s,fn)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=res;t.onerror=()=>rej(t.error)});
const put=(s,o)=>wr(s,x=>x.put(o)).then(()=>fbPush(s,o)),del=(s,id)=>wr(s,x=>x.delete(id));
const nid=(s,p)=>p+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase();
const ask=(msg,info)=>new Promise(res=>{const d=$('#cf');d.innerHTML=`<p style="white-space:pre-line">${esc(msg)}</p><div class=bar><button class=pr>OK</button>${info?'':`<button>${T('বাতিল|Cancel')}</button>`}</div>`;const[a,b]=d.querySelectorAll('button');a.onclick=()=>{d.close();res(true)};if(b)b.onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()});
const dlg=h=>{const d=$('#dlg');if(!h)return d.close();d.dataset.call='';d.innerHTML=h;if(!d.open)d.showModal()};
['#dlg','#cf'].forEach(id=>{const d=$(id);d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(id==='#cf'&&d.oncancel)d.oncancel();d.close()}})});
$('#dlg').addEventListener('close',()=>{const d=$('#dlg');if(d.dataset.call==='1'){ls('callp','');d.dataset.call=''}});
const csv=(h,r)=>'\ufeff'+[h,...r].map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
async function dl(name,data){try{if(DL)await DL.save({filename:name,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove()}return 1}catch(e){if(e.code!=='declined')ask(T('ফাইল সেভ হয়নি|Could not save file'),1)}}
const th=()=>{const r=document.documentElement,d=r.dataset.theme!=='dark';r.dataset.theme=d?'dark':'light';ls('theme',r.dataset.theme)};
const go=k=>{view=k;F='';S='';Q='';scrollTo(0,0);render()};
const agentOf=s=>D.agents.find(a=>a.svc.includes(s))||{};
// ---- works ----
const WF=[['service','সেবা|Service','s',1],['name','গ্রাহকের নাম|Customer name','t',1],['phone','মোবাইল|Mobile','tel',1],['aadhaar','আধার নম্বর (১২ সংখ্যা)|Aadhaar number (12 digits)','aad'],['amob','আধারের সাথে যুক্ত মোবাইল|Aadhaar-linked mobile','tel'],['date','তারিখ|Date','d'],['status','অবস্থা|Status','s'],['callRes','ফোনের ফলাফল|Call result','cs'],['charge','গ্রাহকের চার্জ ₹|Customer charge ₹','n'],['paid','গ্রাহক দিয়েছে ₹|Customer paid ₹','n'],['agentCharge','এজেন্টের খরচ ₹|Agent charge ₹','n'],['notes','নোট|Notes','a']];
const fd=v=>v&&/^\d{4}-\d\d-\d\d$/.test(v)?v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(0,4):(v||'');
const pd=v=>{const m=String(v).match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return null;const d=new Date(+m[3],m[2]-1,+m[1]);return d.getDate()==+m[1]&&d.getMonth()==m[2]-1?m[3]+'-'+m[2]+'-'+m[1]:null};
const fmtA=v=>String(v||'').replace(/\D/g,'').replace(/(\d{4})(?=\d)/g,'$1 ');
const dmask=e=>{const d=e.value.replace(/\D/g,'').slice(0,8);e.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d};
const cal=b=>{const i=b.nextElementSibling,p=pd(b.previousElementSibling.value);if(p)i.value=p;try{i.showPicker()}catch(e){i.focus();i.click()}};
const rates=()=>{const r=(D.settings.find(x=>x.id==='RATES')||{}).rates||{};return{bio:r.bio||['',''],mob:r.mob||[170,120],kid:r.kid||[300,200]}};
function svcPick(sel){const f=sel.form;if(f.dataset.new!=='1')return;const r=rates()[sel.value]||['',''];f.charge.value=r[0];f.agentCharge.value=r[1]}
const rateBox=()=>{const R=rates();return`<div class=box><b>💰 ${T('দামের তালিকা (নতুন কাজে নিজে বসবে)|Price list (auto-fills new work)')}</b><p class=m>${T('গ্রাহক ও এজেন্টের দাম ₹|Customer and agent price ₹')}</p>${Object.entries(SV).map(([k,s])=>`<div class=bar style="flex-wrap:nowrap"><span style="flex:1">${s.i} ${T(s.n)}</span><input id=rc_${k} type=number min=0 placeholder="${T('গ্রাহক|Cust')}" value="${R[k][0]}" style="width:78px"><input id=ra_${k} type=number min=0 placeholder="${T('এজেন্ট|Agent')}" value="${R[k][1]}" style="width:78px"></div>`).join('')}<button class=pr onclick="saveRates()">${T('দাম সেভ|Save prices')}</button></div>`};
async function saveRates(){const r={};for(const k in SV){const c=$('#rc_'+k).value,a=$('#ra_'+k).value;if((c!==''&&+c<0)||(a!==''&&+a<0))return ask(T('দাম ঠিক নয়|Invalid price'),1);r[k]=[c===''?'':+c,a===''?'':+a]}await put('settings',{id:'RATES',rates:r,shopId:'main',updated:new Date().toISOString()});await ld('settings');render();ask(T('দাম সেভ হয়েছে। নতুন কাজে বসবে, পুরনো কাজ বদলাবে না।|Prices saved. New work uses them; old work is unchanged.'),1)}
const inp=([k,l,t,r],v,o)=>{const n=`name=${k}`;let h;
if(t==='a')h=`<textarea ${n} rows=2>${esc(v)}</textarea>`;
else if(t==='cs')h=`<select ${n}><option value="">${T('ফোন করা হয়নি|Not called')}</option>${Object.entries(CR).map(([c,x])=>`<option value=${c} ${v===c?'selected':''}>${esc(T(x))}</option>`).join('')}</select>`;
else if(t==='s'){const O=k==='service'?SV:SS,d=v||Object.keys(O)[0];h=`<select ${n} ${k==='service'?'onchange="svcPick(this)"':''}>${Object.keys(O).filter(x=>x!=='agent').map(x=>`<option value="${x}" ${x==d?'selected':''}>${esc(T(k==='service'?O[x].n:O[x]))}</option>`).join('')}</select>`}
else if(t==='d')h=`<div class=bar style="flex-wrap:nowrap;margin:0"><input ${n} inputmode=numeric maxlength=10 placeholder="${T('দিন/মাস/বছর|DD/MM/YYYY')}" value="${esc(fd(v))}" oninput="dmask(this)"><button type=button onclick="cal(this)">📅</button><input type=date tabindex=-1 style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px" onchange="this.previousElementSibling.previousElementSibling.value=fd(this.value)"></div>`;
else h=`<input ${n} type="${{t:'text',tel:'tel',aad:'text',n:'number'}[t]}" ${t==='n'?'min=0 step=any':''} ${t==='aad'?'inputmode=numeric maxlength=14 placeholder="XXXX XXXX XXXX"':''} value="${esc(t==='aad'?fmtA(v):v)}">`;
return`<label>${esc(T(l))}${r?' *':''}${h}</label>`};
function frm(id,svc){const rt=rates()[svc]||['',''],r=id?D.works.find(x=>x.id===id):{service:svc,date:tod(),charge:rt[0],agentCharge:rt[1]};
dlg(`<form data-new="${id?0:1}" onsubmit="sub(event,'${id||''}')"><h3>${T('কাজ|Work')} ${id||''}</h3>${WF.map(f=>inp(f,r[f[0]]??'')).join('')}<p class=m style="color:var(--m)">⚠ ${T('OTP বা পাসওয়ার্ড লিখবেন না।|Never enter OTP or passwords.')}</p><p id=er class=err></p><div class=bar><button class=pr>${T('সেভ|Save')}</button><button type=button onclick="dlg()">${T('বাতিল|Cancel')}</button></div></form>`)}
async function sub(e,id){e.preventDefault();const o={...(id?D.works.find(x=>x.id===id):{})},fd=new FormData(e.target),er=[];
for(const[k,l,t,r]of WF){const v=(fd.get(k)||'').trim();if(r&&!v)er.push(T(l));else if(t==='tel'&&v&&!nm10(v))er.push(T(l)+' (10 digits)');else if(t==='n'&&v&&(isNaN(v)||+v<0))er.push(T(l)+' (≥0)');else if(t==='aad'&&v&&!/^\d{12}$/.test(v.replace(/\s/g,'')))er.push(T(l)+' (12)');else if(t==='d'&&v&&!pd(v))er.push(T(l)+' (DD/MM/YYYY)');o[k]=t==='n'&&v?+v:t==='aad'?v.replace(/\s/g,''):t==='d'?(pd(v)||''):t==='tel'?(nm10(v)||''):v}
if(er.length)return $('#er').textContent=T('ঠিক করুন: |Fix: ')+er.join(', ');
if(!db)return ask(T('স্টোরেজ নেই, সেভ হবে না।|Storage unavailable.'),1);
if(!id){const d=D.works.find(w=>w.phone===o.phone&&w.service===o.service&&pend(w));if(d&&!await ask(T('একই নম্বরে একই সেবার কাজ চলছে: |Same number & service already open: ')+d.id+' '+d.name+'\n'+T('তবুও সেভ করবেন?|Save anyway?')))return;o.id=nid('works','W');o.created=new Date().toISOString()}
if(id){const ol=D.works.find(x=>x.id===id),rk={new:0,agent:0,done:1,deliv:2,void:3,cancel:3},back=ol&&rk[ol.status]!==undefined&&rk[o.status]!==undefined&&rk[o.status]<rk[ol.status],toFail=ol&&(o.status==='fail'||o.status==='void')&&ol.status!==o.status&&(ol.status==='done'||ol.status==='deliv'),less=ol&&N(o.paid)<N(ol.paid),clr=ol&&ol.callRes&&!o.callRes;
if(back||toFail||less||clr){const m=[back?T('কাজ আগের ধাপে ফিরবে|The job goes back a step')+(ol.settleId?T(' (এজেন্টকে টাকা দেওয়া হয়ে গেছে)| (agent already paid)'):''):'',toFail?T('কাজ ফেল হবে|The job is marked failed'):'',less?T('গ্রাহকের দেওয়া টাকা কমবে: ₹|Customer paid will reduce: ₹')+N(ol.paid)+' → ₹'+N(o.paid):'',clr?T('ফোনের ফলাফল মুছবে|The call result is cleared'):''].filter(Boolean).join('\n');if(!await ask(m+'\n'+T('নিশ্চিত করছেন?|Are you sure?')))return}}
if(o.callRes){if(!o.callAt)o.callAt=new Date().toISOString()}else{delete o.callRes;delete o.callAt}
o.agent=agentOf(o.service).id||'';o.shopId='main';o.updated=new Date().toISOString();
try{await put('works',o);await ld('works')}catch(x){return ask(T('সেভ ব্যর্থ।|Save failed.'),1)}dlg();render()}
async function adv(id){const w=D.works.find(x=>x.id===id);if(!await ask(w.name+'\n→ '+T(SS[NEXT[w.status]])+'\n'+T('নিশ্চিত করছেন?|Are you sure?')))return;w.status=NEXT[w.status];w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
async function rm(id){if(!await ask(T('এই কাজ রিসাইকেল বিনে পাঠাবেন? ৩০ দিন পর স্থায়ীভাবে মুছে যাবে।|Move to the recycle bin? It is removed permanently after 30 days.')))return;const w=D.works.find(x=>x.id===id);w.trashed=new Date().toISOString();w.updated=w.trashed;await put('works',w);await ld('works');render()}
function afrm(id){const a=D.agents.find(x=>x.id===id);dlg(`<form onsubmit="asub(event,'${id}')"><h3>${T('এজেন্ট|Agent')}</h3><label>${T('নাম|Name')} *<input name=name value="${esc(a.name)}"></label><label>${T('ফোন|Phone')}<input name=phone type=tel value="${esc(a.phone||'')}"></label><p id=er class=err></p><div class=bar><button class=pr>${T('সেভ|Save')}</button><button type=button onclick="dlg()">${T('বাতিল|Cancel')}</button></div></form>`)}
async function asub(e,id){e.preventDefault();const a={...D.agents.find(x=>x.id===id)},f=new FormData(e.target);a.name=(f.get('name')||'').trim();a.updated=new Date().toISOString();a.phone=(f.get('phone')||'').trim();
if(!a.name||(a.phone&&!/^[0-9+\- ]{7,15}$/.test(a.phone)))return $('#er').textContent=T('নাম/ফোন ঠিক করুন|Check name/phone');await put('agents',a);await ld('agents');dlg();render()}
// ---- views ----
const due=w=>w.status==='void'?0:N(w.charge)-N(w.paid),adue=w=>(w.status==='done'||w.status==='deliv')?N(w.agentCharge)-N(w.agentPaid):0;
const wc=w=>{const s=SV[w.service],a=D.agents.find(x=>x.id===w.agent)||{};return`<div class=wc style="border-left:6px solid ${s.c}"><div class=r1><b>${s.i} ${esc(w.name)}</b><span class="bd ${w.status}">${T(SS[w.status])}</span></div><div class=m>${T(s.n)} · <a href="tel:${esc(w.phone)}">${esc(w.phone)}</a> · ${esc(fd(w.date))} ${w.aadhaar?'· 🪪 '+esc(fmtA(w.aadhaar)):''} ${w.amob?'· 📞 '+esc(w.amob):''} ${w.ref?'· '+esc(w.ref):''}</div><div class=m>${T('এজেন্ট|Agent')}: ${esc(a.name||'—')} · ${T('গ্রাহকের বাকি|Customer due')} <b>${inr(due(w))}</b> · ${T('এজেন্টকে বাকি|Agent due')} <b>${inr(adue(w))}</b></div><div class=bar>${bad(w)?`<span class=bd style="background:#ef4444">⚠️ ${T('ভুল নম্বর|Wrong number')}</span>`:''}${w.callAt?`<span class=m style="cursor:pointer" onclick="frm('${w.id}')">📞 ${fdt(w.callAt)} · ${T(CR[w.callRes]||'')} ✎</span><a class=m onclick="clrCall('${w.id}')" style="cursor:pointer">✖</a>`:''}${NEXT[w.status]?`<button class=pr onclick="adv('${w.id}')">→ ${T(SS[NEXT[w.status]])}</button>`:''}${w.status!=='void'&&w.status!=='cancel'&&due(w)>0?`<button class=pr onclick="pay('${w.id}')">✅ ${T('টাকা পেয়েছি ₹|Paid ₹')}${due(w)}</button>`:''}<button onclick="callw('${w.id}')">📞</button>${w.status==='done'||w.status==='deliv'?`<button onclick="stt('${w.id}','fail')">⚠️ ${T('ফেল|Failed')}</button>`:''}${w.status==='fail'?`<button class=dg onclick="stt('${w.id}','void')">❌ ${T('চূড়ান্ত ব্যর্থ|Final fail')}</button>`:''}${w.status==='void'&&N(w.paid)>0?`<button class=pr onclick="refd('${w.id}')">↩️ ${T('গ্রাহককে ফেরত ₹|Refund customer ₹')}${N(w.paid)}</button>`:''}${w.refundAmt?`<span class=m>↩️ ${T('ফেরত দেওয়া|Refunded')} ${inr(w.refundAmt)}</span><a class=m onclick="unRef('${w.id}')" style="cursor:pointer">✖</a>`:''}<button onclick="frm('${w.id}')">✎</button><button class=dg onclick="rm('${w.id}')">🗑</button></div></div>`};
function adh(){const t=tod(),mo=t.slice(0,7),L=D.works.filter(live),P=D.works.filter(pend),sm=a=>a.reduce((s,w)=>s+N(w.paid),0);
const K=[['আজকের কাজ|Today’s work',L.filter(w=>w.date===t).length],['চলমান কাজ|Pending',P.length],['আজকের আদায়|Collected today',inr(sm(L.filter(w=>w.date===t)))],['মাসের আদায়|Collected this month',inr(sm(L.filter(w=>(w.date||'').startsWith(mo))))],['গ্রাহকের বাকি|Customer dues',inr(L.reduce((s,w)=>s+Math.max(0,due(w)),0))],['এজেন্টকে বাকি|Agent dues',inr(L.reduce((s,w)=>s+Math.max(0,adue(w)),0))]];
return`<h2>${T('আজকের হিসাব|Overview')}</h2><div class=g>${Object.entries(SV).map(([k,s])=>`<div class=sc style="background:${s.g}"><h3>${s.i} ${T(s.n)}</h3><b>${P.filter(w=>w.service===k).length}</b> ${T('চলমান|pending')}<button onclick="frm('','${k}')">+ ${T('নতুন কাজ|New work')}</button></div>`).join('')}</div><div class=g>${K.map(([l,v])=>`<div class=k>${T(l)}<b>${v}</b></div>`).join('')}</div><h2>${T('চলমান কাজ|Pending work')}</h2>${P.slice().reverse().map(wc).join('')||`<p class=m>${T('কোনো চলমান কাজ নেই।|No pending work.')}</p>`}`}
function works(){let r=D.works.slice().reverse();if(F)r=r.filter(w=>w.service===F);if(S)r=r.filter(w=>(w.status==='agent'?'new':w.status)===S);if(Q)r=r.filter(w=>[w.id,w.name,w.phone,w.ref,w.aadhaar,w.amob].join(' ').toLowerCase().includes(Q));
return`<div class=bar><h2 style="flex:1;margin:0">${T('সব কাজ|All work')} (${r.length})</h2><button class=pr onclick="frm('','${F||'bio'}')">+ ${T('নতুন|New')}</button><button onclick="expC()">CSV</button><button onclick="bin()">🗑 ${D.trash.length}</button></div><div class=bar>${[['','সব|All'],...Object.entries(SV).map(([k,s])=>[k,s.i+' '+s.n])].map(([k,l])=>`<button class="chip ${F===k?'on':''}" onclick="F='${k}';render()">${T(l)}</button>`).join('')}</div><div class=bar><input id=q placeholder="${T('নাম / মোবাইল / ID খুঁজুন|Search name / phone / ID')}" value="${esc(Q)}" oninput="Q=this.value.toLowerCase();render(1)"><select onchange="S=this.value;render()"><option value="">${T('সব অবস্থা|All status')}</option>${Object.entries(SS).filter(([k])=>k!=='agent').map(([k,v])=>`<option value=${k} ${S===k?'selected':''}>${T(v)}</option>`).join('')}</select></div>${r.map(wc).join('')||`<p class=m>${T('কোনো রেকর্ড নেই।|No records yet.')}</p>`}`}
const pf=a=>a.filter(w=>w.status==='done'||w.status==='deliv').reduce((s,w)=>s+N(w.charge)-N(w.agentCharge),0);
const elig=id=>D.works.filter(w=>w.agent===id&&adue(w)>0);
const credits=id=>D.works.filter(w=>w.agent===id&&w.status==='void'&&N(w.agentPaid)>0&&!w.credited);
const sid=()=>'S'+String(Math.max(0,...D.settings.filter(x=>/^S\d+$/.test(x.id)).map(x=>+x.id.slice(1)))+1).padStart(4,'0');
const stlBar=a=>{const e=elig(a.id),c=credits(a.id),tot=e.reduce((s,w)=>s+adue(w),0)-c.reduce((s,w)=>s+N(w.agentPaid),0),h=D.settings.filter(x=>x.kind==='settle'&&!x.voided&&x.agent===a.id).slice(-5).reverse();
return`<div class=bar><button class=pr onclick="stl('${a.id}')" ${e.length||c.length?'':'disabled'}>💰 ${T('হিসাব মেটান|Settle')} (${tot<0?'−':''}${inr(Math.abs(tot))})</button></div>${h.length?`<div class=m>${T('শেষ হিসাব|Recent settlements')}:</div>${h.map(x=>`<div class=m>${fd(x.date)} · ${x.total<0?'−':''}${inr(Math.abs(x.total))} · ${x.items.length}${T('টি কাজ| jobs')} <a onclick="undoStl('${x.id}')" style="cursor:pointer;color:var(--r)">↩️ ${T('বাতিল|Undo')}</a></div>`).join('')}`:''}`};
function stl(aid){const a=D.agents.find(x=>x.id===aid),e=elig(aid),c=credits(aid);
dlg(`<h3>💰 ${T('হিসাব মেটান: |Settle with ')}${esc(a.name)}</h3><p class=m>${T('টিক দেওয়া কাজের টাকা এজেন্টকে দেবেন। ব্যর্থ কাজের টাকা সে ফেরত দেবে, ওটা বাদ যাবে।|Ticked jobs are paid to the agent; failed jobs are deducted.')}</p>${e.map(w=>`<label style="display:flex;gap:8px;align-items:center;color:var(--t)"><input type=checkbox style="width:auto" data-k=e data-id="${w.id}" data-a="${adue(w)}" checked onchange="stlTot()"><span style="flex:1">${esc(w.name)} · ${T(SV[w.service].n)}</span><b>${inr(adue(w))}</b></label>`).join('')||`<p class=m>${T('মেটানোর মতো সম্পন্ন কাজ নেই।|No finished jobs to settle.')}</p>`}${c.length?`<h4>${T('ব্যর্থ কাজ: এজেন্ট ফেরত দেবে|Failed jobs: agent returns')}</h4>`+c.map(w=>`<label style="display:flex;gap:8px;align-items:center;color:var(--t)"><input type=checkbox style="width:auto" data-k=c data-id="${w.id}" data-a="${N(w.agentPaid)}" checked onchange="stlTot()"><span style="flex:1">${esc(w.name)} · ${T(SV[w.service].n)}</span><b>−${inr(w.agentPaid)}</b></label>`).join(''):''}<h3 id=stlt></h3><div class=bar><button class=pr onclick="stlGo('${aid}')">${T('টাকা দিলাম|Paid')}</button><button onclick="dlg()">${T('বাতিল|Cancel')}</button></div>`);stlTot()}
function stlTot(){let t=0;document.querySelectorAll('#dlg input[data-k]:checked').forEach(x=>t+=(x.dataset.k==='e'?1:-1)*N(x.dataset.a));const h=$('#stlt');if(h)h.textContent=t>=0?T('মোট দিতে হবে: |Total to pay: ')+inr(t):T('এজেন্ট আপনাকে দেবে: |Agent pays you: ')+inr(-t)}
async function stlGo(aid){const cs=[...document.querySelectorAll('#dlg input[data-k]:checked')];if(!cs.length)return;const E=cs.filter(x=>x.dataset.k==='e'),C=cs.filter(x=>x.dataset.k==='c'),tot=E.reduce((s,x)=>s+N(x.dataset.a),0)-C.reduce((s,x)=>s+N(x.dataset.a),0);
if(!await ask(T('নিশ্চিত করছেন? মোট ₹|Confirm? Total ₹')+tot+T(' (পরে বাতিল করা যাবে না)| (cannot be undone)')))return;
const id=sid(),now=new Date().toISOString();
for(const x of E){const w=D.works.find(k=>k.id===x.dataset.id);w.agentPaid=N(w.agentPaid)+N(x.dataset.a);w.settleId=id;w.updated=now;await put('works',w)}
for(const x of C){const w=D.works.find(k=>k.id===x.dataset.id);w.credited=id;w.updated=now;await put('works',w)}
await put('settings',{id,kind:'settle',agent:aid,date:tod(),total:tot,items:E.map(x=>({id:x.dataset.id,amt:N(x.dataset.a)})),credits:C.map(x=>({id:x.dataset.id,amt:N(x.dataset.a)})),shopId:'main',updated:now});
await ld('works');await ld('settings');dlg();render()}
async function stt(id,st){const w=D.works.find(x=>x.id===id);if(st==='fail'&&!await ask(T('কাজটা ফেল করবেন? এটা আবার "করতে হবে" অবস্থায় যাবে।|Mark this job as failed? It goes back to "redo".')))return;if(st==='void'&&!await ask(T('চূড়ান্ত ব্যর্থ করবেন? এজেন্ট টাকা ফেরত দেবে।|Mark finally failed? The agent returns the fee.')))return;w.status=st;w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
async function refd(id){const w=D.works.find(x=>x.id===id);if(!await ask(T('গ্রাহককে ফেরত দিয়েছেন? ₹|Refunded the customer? ₹')+N(w.paid)))return;w.refundAmt=N(w.paid);w.paid=0;w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
function agents(){return`<h2>${T('এজেন্ট|Agents')}</h2>`+rateBox()+D.agents.map(a=>{const w=D.works.filter(x=>x.agent===a.id&&live(x)),p=w.filter(pend);return`<div class=box><div class=r1><b>🧑‍💼 ${esc(a.name)}</b><button onclick="afrm('${a.id}')">✎</button></div><div class=m>${esc(a.phone||T('ফোন নেই|No phone'))}</div><div class=bar>${a.svc.map(s=>`<span class=bd style="background:${SV[s].c}">${SV[s].i} ${T(SV[s].n)}</span>`).join('')}</div><div class=g><div class=k>${T('চলমান কাজ|Pending')}<b>${p.length}</b></div><div class=k>${T('মোট কাজ|Total')}<b>${w.length}</b></div><div class=k>${T('এজেন্টকে বাকি|Agent due')}<b>${inr(w.reduce((s,x)=>s+Math.max(0,adue(x)),0))}</b></div></div>${stlBar(a)}${p.map(wc).join('')}</div>`}).join('')}
function expC(){dl('aadhaar-works-'+tod()+'.csv',csv(['ID','Service','Name','Phone','Ref','Aadhaar','AadhaarMobile','Date','Status','Charge','Paid','Agent','AgentCharge','AgentPaid','Notes'],D.works.map(w=>[w.id,SV[w.service].n.split('|')[1],w.name,w.phone,w.ref,w.aadhaar,w.amob,fd(w.date),SS[w.status].split('|')[1],w.charge,w.paid,(D.agents.find(a=>a.id===w.agent)||{}).name,w.agentCharge,w.agentPaid,w.notes])))}
const bk=()=>`<h2>${T('ব্যাকআপ ও গোপনীয়তা|Backup & Privacy')}</h2>${syBox()}<div class=box><div class=bar><button class=pr onclick="expJ()">${T('সম্পূর্ণ JSON ব্যাকআপ|Full JSON backup')}</button><button onclick="expC()">${T('কাজের CSV|Work CSV')}</button></div><p>${T('শেষ ব্যাকআপ: |Last backup: ')}${esc(ls('lastBackup')||T('কখনো না|never'))}</p></div><div class=box><b>${T('JSON থেকে রিস্টোর|Restore from JSON')}</b><p class=m>${T('শুধু মার্জ: নতুন রেকর্ড যোগ হবে, পুরনো কিছু মুছবে না বা বদলাবে না।|Merge only: new records are added; nothing is deleted or overwritten.')}</p><input type=file accept=".json,application/json" onchange="imp(this.files[0]);this.value=''"></div><div class=box><b>${T('গোপনীয়তা নোটিশ|Privacy notice')}</b><p class=m>${T('ডাটা এই ডিভাইসে এবং আপনার Firebase ক্লাউডে (আপনার Google অ্যাকাউন্টের প্রজেক্টে) থাকে, শুধু আপনার জিমেইল ঢুকতে পারে। এনক্রিপ্টেড নয়। কম্পিউটার বা ব্রাউজারের ডাটা মুছলে লগইন করলে ক্লাউড থেকে ফিরে আসে। তবু নিয়মিত JSON ব্যাকআপ নিন। OTP ও পাসওয়ার্ড রাখবেন না।|Data is stored on this device and in your own Firebase cloud project (your Google account); only your Gmail can access it. Not encrypted. If you clear the computer or browser data, signing in restores it from the cloud. Still take JSON backups regularly. Never store OTPs or passwords.')}</p></div>`;
async function expJ(){if(await dl('aadhaar-backup-'+tod()+'.json',JSON.stringify({app:'aadhaar-service-manager',version:1,shopId:'main',exported:new Date().toISOString(),data:{works:D.works,agents:D.agents}},null,1))){ls('lastBackup',new Date().toLocaleString());ls('lastBackupISO',new Date().toISOString());render()}}
async function imp(file){if(!file)return;let j;try{j=JSON.parse(await file.text());if(j.app!=='aadhaar-service-manager'||!j.data)throw 0}catch(e){return ask(T('ব্যাকআপ ফাইল সঠিক নয়।|Invalid backup file.'),1)}
const add={works:[],agents:[]};let nw=0,same=0,cf=0;try{for(const[s,p]of[['works','W'],['agents','A']]){const a=j.data[s]||[];if(!Array.isArray(a))throw 0;for(const r of a){if(!r||typeof r.id!=='string'||r.id[0]!==p)throw 0;const o=D[s].find(x=>x.id===r.id);if(!o){add[s].push(r);nw++}else if(JSON.stringify(o)===JSON.stringify(r))same++;else cf++}}}catch(e){return ask(T('ব্যাকআপের গঠন সঠিক নয়।|Invalid backup structure.'),1)}
if(!await ask(`${file.name} (${Math.round(file.size/1024)} KB) ${j.exported||''}\n${T('নতুন: |New: ')}${nw} · ${T('একই (বাদ): |Same (skipped): ')}${same} · ${T('ID মেলেনি (পুরনোটা থাকবে): |Conflicts (existing kept): ')}${cf}\n${T('কিছু মুছবে না। ইম্পোর্ট করবেন?|Nothing is deleted. Import?')}`))return;

const nm10=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('91'))d=d.slice(2);else if(d.length===11&&d.startsWith('0'))d=d.slice(1);return/^[6-9]\d{9}$/.test(d)?d:''};
const bad=w=>(w.phone&&!nm10(w.phone))||(w.amob&&!nm10(w.amob));
const fdt=iso=>{const d=new Date(iso);if(isNaN(d))return'';const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())};
const CR={ans:'ধরেছে|Picked up',no:'ধরেনি|No answer',off:'বন্ধ|Switched off'};
const bkWarn=()=>{const t=ls('lastBackupISO'),old=!t||(Date.now()-new Date(t))>7*864e5;return old?`<div class=box style="border-color:#ef4444"><b style="color:#ef4444">⚠️ ${t?T('৭ দিনের বেশি ব্যাকআপ নেওয়া হয়নি|No backup for over 7 days'):T('এখনো ব্যাকআপ নেওয়া হয়নি|No backup taken yet')}</b><div class=bar><button class=pr onclick="go('backup')">💾 ${T('ব্যাকআপ নিন|Back up now')}</button></div></div>`:''};
async function pay(id){const w=D.works.find(x=>x.id===id),d=due(w);if(!await ask(T(`বাকি ₹${d} পেয়েছেন?|Received the remaining ₹${d}?`)))return;w.paid=N(w.charge);w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
function callw(id){const w=D.works.find(x=>x.id===id),n=nm10(w.phone)||String(w.phone||'').replace(/\D/g,'');if(!n)return ask(T('ফোন নম্বর নেই|No phone number'),1);ls('callp',id+'|'+Date.now());location.href='tel:'+n}
function chkCall(){const c=ls('callp');if(!c||!D.works.length||$('#dlg').open)return;const[id,t]=c.split('|');if(Date.now()-t>36e5){ls('callp','');return}const w=D.works.find(x=>x.id===id);if(!w){ls('callp','');return}
dlg(`<h3>📞 ${esc(w.name)}</h3><p>${T('ফোনের ফলাফল কী?|How did the call go?')}</p><div class=bar><button class=pr onclick="callRes('${id}','ans')">${T('ধরেছে|Picked up')}</button><button onclick="callRes('${id}','no')">${T('ধরেনি|No answer')}</button><button onclick="callRes('${id}','off')">${T('বন্ধ|Switched off')}</button></div><div class=bar><button onclick="ls('callp','');dlg()">${T('পরে|Later')}</button></div>`);$('#dlg').dataset.call='1'}
async function callRes(id,r){const w=D.works.find(x=>x.id===id),t=+(ls('callp')||'').split('|')[1]||Date.now();w.callAt=new Date(t).toISOString();w.callRes=r;w.updated=new Date().toISOString();await put('works',w);await ld('works');ls('callp','');dlg();render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(chkCall,400)});setTimeout(chkCall,2500);
const BIN_DAYS=30,daysLeft=w=>Math.max(0,BIN_DAYS-Math.floor((Date.now()-new Date(w.trashed))/864e5));
function bin(){dlg(`<h3>🗑 ${T('রিসাইকেল বিন|Recycle bin')} (${D.trash.length})</h3><p class=m>${T('মুছে ফেলা কাজ ৩০ দিন এখানে থাকে, তারপর নিজে স্থায়ীভাবে মুছে যায়।|Deleted work stays here for 30 days, then is removed permanently.')}</p>${D.trash.slice().reverse().map(w=>`<div class=wc><div class=r1><b>${esc(w.name)}</b><span class=m>${daysLeft(w)} ${T('দিন বাকি|days left')}</span></div><div class=m>${T((SV[w.service]||{n:''}).n)} · ${esc(fd(w.date))}</div><div class=bar><button class=pr onclick="restore('${w.id}')">↩️ ${T('ফেরত আনুন|Restore')}</button><button class=dg onclick="purgeOne('${w.id}')">❌ ${T('স্থায়ী মুছুন|Delete forever')}</button></div></div>`).join('')||`<p class=m>${T('বিন খালি।|Bin is empty.')}</p>`}<div class=bar><button onclick="dlg()">OK</button></div>`)}
async function restore(id){const w=D.trash.find(x=>x.id===id);if(!w)return;delete w.trashed;w.updated=new Date().toISOString();await put('works',w);await ld('works');render();bin()}
async function purgeOne(id){if(!await ask(T('স্থায়ীভাবে মুছবেন? আর ফেরানো যাবে না।|Delete forever? This cannot be undone.')))return;await del('works',id);await put('tomb',{id,t:new Date().toISOString()});await ld('tomb');await ld('works');render();bin()}
async function autoPurge(){const old=D.trash.filter(w=>(Date.now()-new Date(w.trashed))>BIN_DAYS*864e5);for(const w of old){await del('works',w.id);await put('tomb',{id:w.id,t:new Date().toISOString()})}if(old.length){await ld('tomb');await ld('works')}}
async function clrCall(id){const w=D.works.find(x=>x.id===id);if(!await ask(T('ফোনের ফলাফল মুছবেন?|Clear the call result?')))return;delete w.callAt;delete w.callRes;w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
async function undoStl(id){const x=D.settings.find(k=>k.id===id);if(!x)return;if(!await ask(T('এই হিসাব বাতিল করবেন? কাজগুলো আবার "মেটানো বাকি" হয়ে যাবে।|Undo this settlement? The jobs become unpaid again.')))return;const now=new Date().toISOString(),all=D.works.concat(D.trash);
for(const it of x.items||[]){const w=all.find(k=>k.id===it.id);if(w){w.agentPaid=Math.max(0,N(w.agentPaid)-N(it.amt));delete w.settleId;w.updated=now;await put('works',w)}}
for(const it of x.credits||[]){const w=all.find(k=>k.id===it.id);if(w){delete w.credited;w.updated=now;await put('works',w)}}
x.voided=true;x.updated=now;await put('settings',x);await ld('works');await ld('settings');render()}
async function unRef(id){const w=D.works.find(x=>x.id===id);if(!w)return;if(!await ask(T('ফেরত বাতিল করবেন? গ্রাহকের টাকা আগের মতো ফিরবে।|Cancel the refund? The customer paid amount is restored.')))return;w.paid=N(w.refundAmt);delete w.refundAmt;w.updated=new Date().toISOString();await put('works',w);await ld('works');render()}
